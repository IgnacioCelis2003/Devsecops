services:
  db-api:
    image: postgres:15
    container_name: db-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_api_data:/var/lib/postgresql/data
      # Montamos los certificados generados (ajusta la ruta si es necesario)
      - ${HOME}/certs_db/nginx-selfsigned.crt:/var/lib/postgresql/nginx-selfsigned.crt:ro
      - ${HOME}/certs_db/nginx-selfsigned.key:/var/lib/postgresql/nginx-selfsigned.key:ro
    networks:
      - app-network
    # Habilitamos SSL mediante flags de configuración
    command: 
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/var/lib/postgresql/nginx-selfsigned.crt"
      - "-c"
      - "ssl_key_file=/var/lib/postgresql/nginx-selfsigned.key"
    healthcheck:
      # Nota: pg_isready funciona por defecto aunque SSL esté activo
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:  
    build: ./vuln-api
    container_name: api
    environment:
      # Añadimos ?sslmode=require al final de la URL
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-api:5432/${POSTGRES_DB}?sslmode=require"
    depends_on:
      db-api:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: frontend
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_api_data:

networks:
  app-network:
    driver: bridge
