services:
  db-api:
    image: docker.io/timescale/timescaledb:2.28.3-pg15
    container_name: db-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_api_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
      # Montamos los certificados generados
      - ${HOME}/certs_db/nginx-selfsigned.crt:/var/lib/postgresql/nginx-selfsigned.crt:ro
      - ${HOME}/certs_db/nginx-selfsigned.key:/var/lib/postgresql/nginx-selfsigned.key:ro
    networks:
      - app-network
    # Habilitamos SSL mediante flags de configuración
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/var/lib/postgresql/nginx-selfsigned.crt"
      - "-c"
      - "ssl_key_file=/var/lib/postgresql/nginx-selfsigned.key"

  api:
    build: ./vuln-api
    container_name: api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Añadimos ?sslmode=require al final de la URL
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-api:5432/${POSTGRES_DB}?sslmode=require"
      SEED_EXAMPLE_DATA: "${SEED_EXAMPLE_DATA:-true}"
    depends_on:
      - db-api
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-/grupo3/api}
        - VITE_BASE=${VITE_BASE:-/grupo3/}
    container_name: frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8113:80"
      - "8103:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - app-network

volumes:
  postgres_api_data:

networks:
  app-network:
    driver: bridge
