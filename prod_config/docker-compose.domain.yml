services:
  db-api:
    image: docker.io/timescale/timescaledb:2.28.3-pg15
    container_name: db-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_api_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network

  api:
    build: ./vuln-api
    container_name: api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-api:5432/${POSTGRES_DB}
      SEED_EXAMPLE_DATA: "${SEED_EXAMPLE_DATA:-false}"
    depends_on:
      - db-api
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8113:80"
      - "8103:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt # <-- Certificados finales
      - ./certbot/www:/var/www/certbot  # <-- Archivos de validación
    depends_on:
      - api
    networks:
      - app-network

  certbot:
    image: docker.io/certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  postgres_api_data:

networks:
  app-network:
    driver: bridge
